name: Bug report
description: Report reproducible incorrect behavior in Almanac
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Search existing issues before filing a new report. Do not disclose security vulnerabilities here; use private vulnerability reporting instead.
  - type: input
    id: version
    attributes:
      label: Almanac version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Node.js version, package manager, and Git version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal repository, commands, or exact steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include complete error output with secrets and private paths removed.
    validations:
      required: true
